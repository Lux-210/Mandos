// ---------------------------------------------------------------------------
// Sincronización con GitHub Gist (idéntico al mecanismo original, solo
// cambian las claves de almacenamiento y la descripción del gist)
// ---------------------------------------------------------------------------
async function ghRequest(token, path, options = {}) {
  const res = await fetch(`https://api.github.com${path}`, {
    ...options,
    headers: {
      Authorization: `Bearer ${token}`,
      Accept: "application/vnd.github+json",
      ...(options.body ? { "Content-Type": "application/json" } : {}),
      ...(options.headers || {}),
    },
  });
  if (!res.ok) {
    const err = new Error(`GitHub API error: ${res.status}`);
    err.status = res.status;
    try {
      const body = await res.json();
      err.detail = body && body.message;
    } catch (e) {}
    throw err;
  }
  return res.json();
}

async function findExistingGist(token) {
  const gists = await ghRequest(token, "/gists?per_page=100");
  if (!Array.isArray(gists)) return null;
  const found = gists.find((g) => g.description === GH_GIST_DESCRIPTION && g.files && g.files[GH_GIST_FILENAME]);
  return found ? found.id : null;
}

async function createGist(token, data) {
  const created = await ghRequest(token, "/gists", {
    method: "POST",
    body: JSON.stringify({
      description: GH_GIST_DESCRIPTION,
      public: false,
      files: { [GH_GIST_FILENAME]: { content: JSON.stringify(data, null, 2) } },
    }),
  });
  return created.id;
}

async function pullGist(token, gistId) {
  const gist = await ghRequest(token, `/gists/${gistId}`);
  const file = gist.files && gist.files[GH_GIST_FILENAME];
  if (!file) throw new Error("El gist no contiene el archivo esperado.");
  let content = file.content;
  if (file.truncated && file.raw_url) {
    const res = await fetch(file.raw_url);
    content = await res.text();
  }
  return normalizeImportedControllers(JSON.parse(content || "[]"));
}

async function pushGist(token, gistId, data) {
  await ghRequest(token, `/gists/${gistId}`, {
    method: "PATCH",
    body: JSON.stringify({ files: { [GH_GIST_FILENAME]: { content: JSON.stringify(data, null, 2) } } }),
  });
}

function friendlySyncError(err) {
  if (!err) return "Ocurrió un error al sincronizar.";
  if (err.status === 401) return "El token no es válido o fue revocado.";
  if (err.status === 403) return "GitHub rechazó la solicitud (límite de uso o permisos insuficientes).";
  if (err.status === 404) return "No se encontró el gist. Puede haber sido borrado.";
  if (typeof navigator !== "undefined" && navigator.onLine === false) return "Sin conexión a internet. Se reintentará más tarde.";
  return err.message || "Ocurrió un error al sincronizar.";
}

function timeAgo(timestamp) {
  if (!timestamp) return "";
  const diff = Math.max(0, Date.now() - timestamp);
  const minutes = Math.floor(diff / 60000);
  if (minutes < 1) return "hace un momento";
  if (minutes < 60) return `hace ${minutes} min`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `hace ${hours} h`;
  return `hace ${Math.floor(hours / 24)} d`;
}

// ---------------------------------------------------------------------------
// Utilidades de dominio
// ---------------------------------------------------------------------------
function normalizeStatus(status) {
  return STATUS_META[status] ? status : "detectado";
}

function statusBreakdown(issues) {
  const counts = { detectado: 0, en_reparacion: 0, sin_solucion: 0, resuelto: 0 };
  issues.forEach((issue) => {
    const s = normalizeStatus(issue.status);
    counts[s] = (counts[s] || 0) + 1;
  });
  return counts;
}

function sortIssues(issues, sortBy) {
  if (sortBy === "titulo") return [...issues].sort((a, b) => a.titulo.localeCompare(b.titulo, "es"));
  if (sortBy === "status")
    return [...issues].sort((a, b) => STATUS_ORDER[normalizeStatus(a.status)] - STATUS_ORDER[normalizeStatus(b.status)]);
  return issues;
}

function sortControllers(controllers, sortBy) {
  const list = [...controllers];
  if (sortBy === "nombre") list.sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
  else if (sortBy === "issues") list.sort((a, b) => b.issues.length - a.issues.length);
  list.sort((a, b) => (b.favorite ? 1 : 0) - (a.favorite ? 1 : 0));
  return list;
}

function findDuplicateIssue(issues, titulo, excludeId) {
  const target = titulo.trim().toLowerCase();
  return issues.find((issue) => issue.id !== excludeId && issue.titulo.trim().toLowerCase() === target) || null;
}

function nextAvailableTitle(issues, titulo, excludeId) {
  const used = new Set(issues.filter((issue) => issue.id !== excludeId).map((issue) => issue.titulo.trim().toLowerCase()));
  let n = 2;
  let candidate = `${titulo} (${n})`;
  while (used.has(candidate.toLowerCase())) {
    n += 1;
    candidate = `${titulo} (${n})`;
  }
  return candidate;
}

function normalizeText(text) {
  return (text || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function formatDate(timestamp) {
  return timestamp
    ? new Date(timestamp).toLocaleDateString("es", { day: "2-digit", month: "2-digit", year: "numeric" })
    : "";
}

function issueMatchesQuery(issue, query) {
  return (
    normalizeText(issue.titulo).includes(query) ||
    normalizeText(issue.tipo).includes(query) ||
    (issue.tags || []).some((tag) => normalizeText(tag).includes(query))
  );
}

function timestampToDateInputValue(timestamp) {
  if (!timestamp) return "";
  const d = new Date(timestamp);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function dateInputValueToTimestamp(value) {
  if (!value) return null;
  const [y, m, d] = value.split("-").map(Number);
  return y && m && d ? new Date(y, m - 1, d).getTime() : null;
}

function reminderUrgency(timestamp) {
  if (!timestamp) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  if (timestamp < today.getTime()) return "overdue";
  if (timestamp < today.getTime() + 86400000) return "today";
  return "upcoming";
}

function hasMeaningfulUpdate(issue) {
  return issue.updatedAt && issue.createdAt && issue.updatedAt - issue.createdAt > 60000;
}

function downloadJSON(data, filename) {
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportControllers(controllers) {
  downloadJSON(controllers, `mis-dualsense-${new Date().toISOString().slice(0, 10)}.json`);
}

function exportSingleController(controller) {
  downloadJSON([controller], `backup-mando-eliminado-${new Date().toISOString().replace(/[:.]/g, "-")}.json`);
}

function uid() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}

function emptyController() {
  return {
    id: uid(),
    nombre: "",
    color: "",
    colorHex: DEFAULT_COLOR_HEX,
    consolaOrigen: "",
    consolaActual: "",
    origenVisible: true,
    actualVisible: true,
    edicionTipo: "",
    edicionNombre: "",
    notes: "",
    favorite: false,
    issues: [],
  };
}

function emptyIssue() {
  const now = Date.now();
  return {
    id: uid(),
    titulo: "",
    tipo: ISSUE_TYPES[0],
    status: "detectado",
    notes: "",
    createdAt: now,
    updatedAt: now,
    tags: [],
    reminder: null,
    statusHistory: [],
  };
}

function normalizeImportedControllers(data) {
  if (!Array.isArray(data)) throw new Error("El archivo no contiene una lista de mandos.");
  return data.map((raw) => {
    const rawIssues = Array.isArray(raw && raw.issues) ? raw.issues : [];
    return {
      id: raw && raw.id ? String(raw.id) : uid(),
      nombre: raw && typeof raw.nombre === "string" ? raw.nombre : "",
      color: raw && typeof raw.color === "string" ? raw.color : "",
      colorHex: raw && typeof raw.colorHex === "string" ? raw.colorHex : DEFAULT_COLOR_HEX,
      // "consolaOrigen": con qué consola vino el mando originalmente (o si se
      // compró por separado). "consolaActual": con qué consola se usa hoy
      // (puede ser distinta). Los datos exportados con una versión anterior
      // de la app solo tenían "ps5Model", que representaba la consola de
      // origen: se migra para no perder lo ya cargado. La opción "Comprado
      // por separado" se renombró a "Comprado": se migra también para no
      // perder ese dato en mandos ya guardados.
      consolaOrigen: (() => {
        const migrarLegacy = (v) => (v === "Comprado por separado" ? "Comprado" : v);
        const origen = raw && typeof raw.consolaOrigen === "string" ? migrarLegacy(raw.consolaOrigen) : null;
        if (origen && CONSOLE_ORIGEN_OPTIONS.includes(origen)) return origen;
        const legacy = raw && typeof raw.ps5Model === "string" ? migrarLegacy(raw.ps5Model) : null;
        if (legacy && CONSOLE_ORIGEN_OPTIONS.includes(legacy)) return legacy;
        return "";
      })(),
      consolaActual: raw && typeof raw.consolaActual === "string" && PS5_MODELS.includes(raw.consolaActual) ? raw.consolaActual : "",
      // Visibilidad en la tarjeta de "Vino: ..." / "Actual: ...". Por
      // defecto se muestran (true); los mandos guardados con una versión
      // anterior de la app no tienen este campo y deben seguir mostrándose
      // igual que antes, por eso solo se ocultan si el valor es false.
      origenVisible: !(raw && raw.origenVisible === false),
      actualVisible: !(raw && raw.actualVisible === false),
      edicionTipo:
        raw && typeof raw.edicionTipo === "string" && EDITION_TYPES.some((e) => e.value === raw.edicionTipo) ? raw.edicionTipo : "",
      edicionNombre: raw && typeof raw.edicionNombre === "string" ? raw.edicionNombre : "",
      notes: raw && typeof raw.notes === "string" ? raw.notes : "",
      favorite: !!(raw && raw.favorite),
      issues: rawIssues.map((rawIssue) => {
        const createdAt = rawIssue && typeof rawIssue.createdAt === "number" ? rawIssue.createdAt : Date.now();
        const status = rawIssue ? normalizeStatus(rawIssue.status) : "detectado";
        return {
          id: rawIssue && rawIssue.id ? String(rawIssue.id) : uid(),
          titulo: rawIssue && typeof rawIssue.titulo === "string" ? rawIssue.titulo : "",
          tipo: rawIssue && typeof rawIssue.tipo === "string" && rawIssue.tipo.trim() ? rawIssue.tipo : ISSUE_TYPES[0],
          status,
          notes: rawIssue && typeof rawIssue.notes === "string" ? rawIssue.notes : "",
          createdAt,
          updatedAt: rawIssue && typeof rawIssue.updatedAt === "number" ? rawIssue.updatedAt : createdAt,
          tags:
            rawIssue && Array.isArray(rawIssue.tags)
              ? rawIssue.tags.filter((t) => typeof t === "string" && t.trim())
              : [],
          reminder: rawIssue && typeof rawIssue.reminder === "number" ? rawIssue.reminder : null,
          statusHistory:
            rawIssue && Array.isArray(rawIssue.statusHistory) && rawIssue.statusHistory.length > 0
              ? rawIssue.statusHistory
                  .filter((h) => h && typeof h.status === "string" && typeof h.changedAt === "number")
                  .map((h) => ({ status: normalizeStatus(h.status), changedAt: h.changedAt }))
              : [{ status, changedAt: createdAt }],
        };
      }),
    };
  });
}

// Combina mandos importados con los que ya existen. A diferencia del correo en
// la versión original, acá no hay un dato "único" natural para un mando, así
// que la coincidencia se hace por id — lo que además es justo lo que se
// necesita para que la sincronización entre dispositivos funcione bien.
function mergeImportedControllers(current, imported) {
  const merged = current.map((c) => ({ ...c, issues: [...c.issues] }));
  let mergedCount = 0;
  let newCount = 0;
  let renamedIssuesCount = 0;
  let skippedIssuesCount = 0;
  const addedControllerIds = [];
  const addedIssueIdsByController = {};

  imported.forEach((incoming) => {
    const idx = merged.findIndex((c) => c.id === incoming.id);
    if (idx >= 0) {
      mergedCount += 1;
      const controllerId = merged[idx].id;
      const issues = [...merged[idx].issues];
      const addedIssueIds = [];
      incoming.issues.forEach((issue) => {
        if (issues.some((existing) => existing.id === issue.id)) {
          skippedIssuesCount += 1;
          return;
        }
        let titulo = issue.titulo;
        if (findDuplicateIssue(issues, titulo, null)) {
          titulo = nextAvailableTitle(issues, titulo, null);
          renamedIssuesCount += 1;
        }
        issues.push({ ...issue, titulo });
        addedIssueIds.push(issue.id);
      });
      merged[idx] = { ...merged[idx], issues };
      if (addedIssueIds.length > 0) {
        addedIssueIdsByController[controllerId] = (addedIssueIdsByController[controllerId] || []).concat(addedIssueIds);
      }
    } else {
      newCount += 1;
      merged.push(incoming);
      addedControllerIds.push(incoming.id);
    }
  });

  return {
    controllers: merged,
    mergedCount,
    newCount,
    renamedIssuesCount,
    skippedIssuesCount,
    addedControllerIds,
    addedIssueIdsByController,
  };
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? normalizeImportedControllers(JSON.parse(raw)) : [];
  } catch (e) {
    return [];
  }
}

// Arma las etiquetas a mostrar en una tarjeta: consola(s) y edición.
// - Consola: si el mando vino con una consola y hoy se usa con otra, se
//   muestran ambas para no perder el dato; si son la misma (o solo se cargó
//   una), se muestra una sola vez.
// - Edición: solo se muestra cuando es una edición limitada (una edición
//   "normal" no aporta información y no se marca).
// alwaysShow=true ignora los flags de visibilidad (se usa en la vista de
// detalle del mando, que siempre muestra esta info); si es false/omitido, se
// respeta origenVisible/actualVisible (se usa en la tarjeta chica del
// listado, donde el botón del ojo puede ocultarla).
function infoChipList(controller, alwaysShow) {
  const chips = [];
  const origen = alwaysShow || controller.origenVisible !== false ? controller.consolaOrigen : "";
  const actual = alwaysShow || controller.actualVisible !== false ? controller.consolaActual : "";
  if (origen && actual && origen !== actual) {
    chips.push({ key: "origen", text: "Vino: " + origen });
    chips.push({ key: "actual", text: "Actual: " + actual });
  } else {
    const single = actual || origen;
    if (single) chips.push({ key: "single", text: single });
  }
  if (controller.edicionTipo === "limitada") {
    const nombre = (controller.edicionNombre || "").trim();
    chips.push({ key: "edicion", text: nombre ? "Edición: " + nombre : "Edición limitada" });
  }
  return chips;
}

                className: `py-2 rounded-md border text-xs font-medium font-label uppercase tracking-wide transition-colors ${status === key ? meta.badge : "border-slate-600 text-slate-500 hover:border-slate-500"}`,
              },
              meta.label
            )
          )
        )
      ),
      React.createElement(
        "div",
        null,
        React.createElement("label", { className: "font-label block text-xs text-slate-500 uppercase tracking-wide mb-1.5" }, "Etiquetas (opcional)"),
        React.createElement("input", {
          value: tagsText,
          onChange: (e) => setTagsText(e.target.value),
          placeholder: "bajo garantía, service, comprado 2024...",
          className: "w-full px-3 py-2 rounded-md border border-slate-600 bg-slate-700 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500",
        }),
        React.createElement("p", { className: "text-xs text-slate-500 mt-1" }, "Separadas por coma.")
      ),
      React.createElement(
        "div",
        null,
        React.createElement("label", { className: "font-label block text-xs text-slate-500 uppercase tracking-wide mb-1.5" }, "Recordatorio (opcional)"),
        React.createElement(
          "div",
          { className: "flex gap-2" },
          React.createElement("input", {
            type: "date",
            value: reminderValue,
            onChange: (e) => {
              setReminderValue(e.target.value);
              if (e.target.value && typeof Notification !== "undefined" && Notification.permission === "default") {
                Notification.requestPermission().catch(() => {});
              }
            },
            className: "flex-1 px-3 py-2 rounded-md border border-slate-600 bg-slate-700 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500",
          }),
          reminderValue &&
            React.createElement(
              "button",
              { type: "button", onClick: () => setReminderValue(""), className: "px-3 py-2 rounded-md text-xs font-medium text-slate-400 hover:bg-slate-700 transition-colors" },
              "Quitar"
            )
        )
      ),
      React.createElement(
        "div",
        null,
        React.createElement("label", { className: "font-label block text-xs text-slate-500 uppercase tracking-wide mb-1.5" }, "Notas (opcional)"),
        React.createElement("textarea", {
          value: notes,
          onChange: (e) => setNotes(e.target.value),
          placeholder: "Contexto, qué tan seguido pasa, qué probaste ya...",
          rows: 3,
          className: "w-full px-3 py-2 rounded-md border border-slate-600 bg-slate-700 text-sm text-slate-200 placeholder-slate-500 resize-none focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500",
        })
      ),
      history.length > 0 &&
        React.createElement(
          "div",
          null,
          React.createElement("label", { className: "font-label block text-xs text-slate-500 uppercase tracking-wide mb-1.5" }, "Historial de estados"),
          React.createElement(
            "div",
            { className: "flex flex-col gap-1.5 bg-slate-800 border border-slate-600 rounded-md p-2.5 max-h-32 overflow-y-auto" },
            history.map((entry, index) => {
              const meta = STATUS_META[normalizeStatus(entry.status)];
              return React.createElement(
                "div",
                { key: index, className: "flex items-center justify-between gap-2" },
                React.createElement("span", { className: `font-label inline-block px-1.5 py-0.5 text-xs font-semibold uppercase tracking-wide border rounded-sm ${meta.badge}` }, meta.label),
                React.createElement("span", { className: "font-label text-xs text-slate-500" }, formatDate(entry.changedAt))
              );
            })
          )
        ),
      isConfirming &&
        React.createElement(
          "div",
          { role: "status", className: "bg-amber-900 border border-amber-700 rounded-md p-3" },
          React.createElement(
            "p",
            { className: "text-xs text-amber-200 mb-2" },
            'Ya existe una falla con la descripción "',
            titulo.trim(),
            '". ¿Querés guardarla igual? Se guardará como "',
            suggestedTitle,
            '".'
          ),
          React.createElement(
            "div",
            { className: "flex gap-2" },
            React.createElement(
              "button",
              {
                type: "button",
                autoFocus: true,
                onClick: () => onSave(buildIssue(suggestedTitle)),
                className: "flex-1 text-xs font-medium text-white bg-amber-700 hover:bg-amber-600 rounded py-1.5 transition-colors",
              },
              'Sí, usar "',
              suggestedTitle,
              '"'
            ),
            React.createElement("button", { type: "button", onClick: cancelDuplicateFlow, className: "flex-1 text-xs font-medium text-slate-300 hover:bg-slate-600 rounded py-1.5 transition-colors" }, "Cambiar descripción")
          )
        ),
      React.createElement(
        "div",
        { className: "flex justify-end gap-2 mt-1" },
        React.createElement("button", { type: "button", onClick: onCancel, className: "px-3.5 py-2 rounded-md text-sm font-medium text-slate-400 hover:bg-slate-700 transition-colors" }, "Cancelar"),
        !isConfirming &&
          React.createElement("button", { type: "button", onClick: handleSave, className: "px-3.5 py-2 rounded-md text-sm font-medium bg-teal-600 text-white hover:bg-teal-500 transition-colors" }, "Guardar")
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(DualSenseTracker, null));

</script>
<script>
  // Registra el service worker solo si la app se sirve por HTTPS o localhost.
  // Si se abre el archivo directamente (file://), esto no hace nada (y no rompe nada).
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
